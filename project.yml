name: UTM Snapshot Manager
options:
  bundleIdPrefix: com.github.nurkert
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    COMBINE_HIDPI_IMAGES: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  UTM Snapshot Manager:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.nurkert.UTMSnapshotManager
        PRODUCT_NAME: UTM Snapshot Manager
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Apache License 2.0"
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "So your UTM virtual machines can be found automatically."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "So your UTM virtual machines can be found automatically."
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "So your UTM virtual machines can be found automatically."
        # Required to ask UTM whether a machine is running. Without this the app
        # cannot tell running from paused and refuses to write to any disk.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "So UTM Snapshot Manager can check whether a machine is shut down before changing its disk, and start or stop it on your behalf."
